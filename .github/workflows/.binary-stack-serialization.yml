name: Binary Stack Serialization Tests
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  # We can't run these tests with the coverage enabled because it will modify the stack it's
  # trying to serialize making the tests fail in some situations
  unit-tests-pharo-10:
    runs-on: ubuntu-latest
    name: Pharo64-10
    steps:
      - uses: actions/checkout@v7
      - name: Load Image and Run Tests
        uses: ba-st-actions/pharo-ci@v10
        with:
          spec: .smalltalkci/.binary-stack-serialization.ston
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 15
  unit-tests-pharo-11:
    runs-on: ubuntu-latest
    name: Pharo64-11
    steps:
      - uses: actions/checkout@v7
      - name: Load Image and Run Tests
        uses: ba-st-actions/pharo-ci@v11
        with:
          spec: .smalltalkci/.binary-stack-serialization.ston
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 15
  unit-tests-pharo-12:
    runs-on: ubuntu-latest
    name: Pharo64-12
    steps:
      - uses: actions/checkout@v7
      - name: Load Image and Run Tests
        uses: ba-st-actions/pharo-ci@v12
        with:
          spec: .smalltalkci/.binary-stack-serialization.ston
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 15
  unit-tests-pharo-13:
    runs-on: ubuntu-latest
    name: Pharo64-13
    steps:
      - uses: actions/checkout@v7
      - name: Load Image and Run Tests
        uses: ba-st-actions/pharo-ci@v13
        with:
          spec: .smalltalkci/.binary-stack-serialization.ston
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 15
